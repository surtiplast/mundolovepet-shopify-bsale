# ─────────────────────────────────────────────────────────────────────────────
# Mundo Love Pet — Shopify × Bsale
# Blueprint de Render (infraestructura como código)
#
# Despliegue:  Dashboard de Render → New → Blueprint → seleccionar este repo
# Validación:  render blueprints validate render.yaml   (Render CLI ≥ 2.7.0)
#
# ⚠️ NINGÚN secreto va en este archivo. Los tokens usan `sync: false`, así que
#    Render te los pide en el navegador al crear el Blueprint.
#
# ─────────────────────────────────────────────────────────────────────────────
# ESTADO: base de datos, servicio web y cron de sincronización.
#
# ── Por qué NO hay cola ni worker ────────────────────────────────────────────
#
# El plan original era BullMQ con un worker permanente. Para este caso es
# desproporcionado: sincronizar un catálogo dos veces al día no necesita una
# cola, y un worker encendido las 24 horas más su Redis suman unos 21 USD al
# mes.
#
# El cron `mlp-sync-auto` hace el mismo trabajo, cuesta una fracción y reutiliza
# exactamente el código que ya usa el panel. La cola tendría sentido si hubiera
# que reaccionar a webhooks en segundos o si el volumen creciera mucho; hoy no
# es el caso, y montarla «por si acaso» sería pagar y mantener algo que no
# resuelve ningún problema real.
#
# Los bloques `mlp-queue` y `mlp-worker` se quedan comentados por si algún día
# hace falta ese salto.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: mlp-db
    databaseName: mlp_sync
    user: mlp
    # basic-256mb es suficiente para una tienda. Subir a basic-1gb si el
    # historial de logs crece. NO usar `free`: expira a los 30 días y no
    # tiene backups.
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: '18'
    # Lista vacía = sólo conexiones por la red privada de Render.
    # La base de datos no queda expuesta a internet.
    ipAllowList: []

services:
#   # ── Cola de trabajos ───────────────────────────────────────────────────────
#   - type: keyvalue
#     name: mlp-queue
#     plan: starter
#     region: virginia
#     # Sólo red privada. `ipAllowList` es obligatorio para Key Value.
#     ipAllowList: []
#     # noeviction: si la memoria se llena, preferimos un error de escritura a que
#     # Render descarte silenciosamente un job de facturación pendiente.
#     maxmemoryPolicy: noeviction
#     # journal-snapshot: la cola sobrevive a reinicios. Con `off` se perderían
#     # los pedidos encolados y sin facturar.
#     persistenceMode: journal-snapshot

  # ── API + panel + receptor de webhooks ─────────────────────────────────────
  - type: web
    name: mlp-sync
    runtime: node
    plan: starter # NO usar `free`: ver DESPLIEGUE-RENDER.md §2
    region: virginia
    # `--include=dev` es OBLIGATORIO. Con NODE_ENV=production (más abajo) npm
    # omite las devDependencies, y el build las necesita: typescript y
    # @types/node están ahí. Sin la bandera falla con:
    #   error TS2688: Cannot find type definition file for 'node'.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Las migraciones corren antes de arrancar, no dentro del start command.
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Margen para terminar de responder a un webhook de Shopify en curso
    # antes de que Render mate el proceso durante un despliegue.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_VERSION
        value: '2026-07'
      - key: BSALE_API_BASE_URL
        value: https://api.bsale.io/v1
      - key: ADMIN_EMAIL
        value: surtiplast.pe@gmail.com

      # APP_URL: se autorreferencia al hostname que Render asigna al servicio.
      - key: APP_URL
        fromService:
          name: mlp-sync
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: DATABASE_URL
        fromDatabase:
          name: mlp-db
          property: connectionString

#       - key: REDIS_URL
#         fromService:
#           name: mlp-queue
#           type: keyvalue
#           property: connectionString

      # generateValue produce un valor aleatorio de 256 bits en base64 —
      # exactamente los 32 bytes que exige AES-256-GCM.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BSALE_WEBHOOK_PATH_SECRET
        generateValue: true

      # sync: false → Render los pide en el navegador. Nunca en el repositorio.
      - key: SHOPIFY_SHOP_DOMAIN
        sync: false
      # Credenciales de la app del Dev Dashboard. Desde el 1 de enero de 2026
      # Shopify no permite crear apps personalizadas desde el admin de la
      # tienda, que eran las que daban un token estático `shpat_`. Ahora el
      # token se pide con client credentials y caduca cada ~24 h: lo renueva
      # src/integrations/shopify/token.ts.
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: BSALE_ACCESS_TOKEN
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # IDs descubiertos en la Fase 1 con /api/connections/bsale/discover.
      # Se completan en el dashboard después del primer despliegue.
      - key: BSALE_OFFICE_ID
        sync: false
      - key: BSALE_PRICE_LIST_ID
        sync: false
      - key: BSALE_DOCTYPE_BOLETA_ID
        sync: false
      - key: BSALE_DOCTYPE_FACTURA_ID
        sync: false
      - key: BSALE_TAX_ID_IGV
        sync: false

      # Almacenamiento de comprobantes PDF (S3-compatible: R2 / B2 / S3).
      # En Render NO se usa disco persistente para esto — ver
      # DESPLIEGUE-RENDER.md §4. Necesario a partir de la Fase 7.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

#   # ── Worker: sincronización y emisión de documentos ─────────────────────────
#   # Servicio aparte para que una sincronización pesada del catálogo no bloquee
#   # la respuesta a un webhook de Shopify (que debe contestar 200 en segundos).
#   - type: worker
#     name: mlp-worker
#     runtime: node
#     plan: starter
#     region: virginia
#     buildCommand: npm ci --include=dev && npx prisma generate && npm run build
#     startCommand: node dist/worker.js # se crea en la Fase 3
#     autoDeployTrigger: commit
#     # Un job de emisión en curso NO debe cortarse a la mitad: sin esto, un
#     # despliegue podría dejar un documento en estado indeterminado en Bsale.
#     maxShutdownDelaySeconds: 120
#     envVars:
#       - key: NODE_ENV
#         value: production
#       - key: ROLE
#         value: worker
#       # El worker comparte configuración con el servicio web. Reutilizamos sus
#       # variables en vez de duplicarlas, para que no se desincronicen.
#       - key: DATABASE_URL
#         fromDatabase:
#           name: mlp-db
#           property: connectionString
#       - key: REDIS_URL
#         fromService:
#           name: mlp-queue
#           type: keyvalue
#           property: connectionString
#       - key: ENCRYPTION_KEY
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: ENCRYPTION_KEY
#       - key: SESSION_SECRET
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: SESSION_SECRET
#       - key: ADMIN_EMAIL
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: ADMIN_EMAIL
#       - key: SHOPIFY_SHOP_DOMAIN
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: SHOPIFY_SHOP_DOMAIN
#       - key: SHOPIFY_CLIENT_ID
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: SHOPIFY_CLIENT_ID
#       - key: SHOPIFY_CLIENT_SECRET
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: SHOPIFY_CLIENT_SECRET
#       - key: SHOPIFY_API_VERSION
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: SHOPIFY_API_VERSION
#       - key: BSALE_ACCESS_TOKEN
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: BSALE_ACCESS_TOKEN
#       - key: BSALE_API_BASE_URL
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: BSALE_API_BASE_URL
#
#   # ── Respaldo por polling mientras Bsale activa los webhooks ────────────────
#   # Bsale activa sus webhooks por solicitud manual a ayuda@bsale.app. Hasta
#   # entonces, este cron mantiene sincronizados stock y precios.
#   # Se puede desactivar cuando los webhooks estén operativos.
#   - type: cron
#     name: mlp-poll-bsale-OBSOLETO
#     runtime: node
#     plan: starter
#     region: virginia
#     schedule: '*/10 * * * *' # cada 10 minutos
#     buildCommand: npm ci --include=dev && npx prisma generate && npm run build
#     startCommand: node dist/jobs/poll-bsale.js # se crea en la Fase 3
#     envVars:
#       - key: NODE_ENV
#         value: production
#       - key: DATABASE_URL
#         fromDatabase:
#           name: mlp-db
#           property: connectionString
#       - key: REDIS_URL
#         fromService:
#           name: mlp-queue
#           type: keyvalue
#           property: connectionString
#       - key: ENCRYPTION_KEY
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: ENCRYPTION_KEY
#       - key: BSALE_ACCESS_TOKEN
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: BSALE_ACCESS_TOKEN
#       - key: BSALE_API_BASE_URL
#         fromService:
#           name: mlp-sync
#           type: web
#           envVarKey: BSALE_API_BASE_URL
#
  # ── Sincronización automática ──────────────────────────────────────────────
  #
  # Lee Bsale, compara con Shopify y aplica las diferencias de stock. Los
  # precios sólo si `SYNC_AUTO_PRECIOS=1`.
  #
  # NO crea productos ni emite comprobantes: esas dos decisiones siguen siendo
  # humanas y se toman desde el panel.
  - type: cron
    name: mlp-sync-auto
    runtime: node
    region: virginia
    plan: starter
    # Dos veces al día, a las 7:00 y a las 19:00 en Lima (UTC-5). Render usa
    # UTC, de ahí las 12 y las 0.
    #
    # Se evita la medianoche exacta y las horas en punto más congestionadas: si
    # miles de crons arrancan a la vez, las APIs de terceros responden peor.
    schedule: '10 12,0 * * *'
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node dist/jobs/sincronizar.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mlp-db
          property: connectionString
      # Los secretos se copian del servicio web para no tenerlos en dos sitios
      # y que se puedan rotar de una vez.
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: mlp-sync
          envVarKey: ENCRYPTION_KEY
      - key: BSALE_ACCESS_TOKEN
        fromService:
          type: web
          name: mlp-sync
          envVarKey: BSALE_ACCESS_TOKEN
      - key: SHOPIFY_SHOP_DOMAIN
        fromService:
          type: web
          name: mlp-sync
          envVarKey: SHOPIFY_SHOP_DOMAIN
      - key: SHOPIFY_CLIENT_ID
        fromService:
          type: web
          name: mlp-sync
          envVarKey: SHOPIFY_CLIENT_ID
      - key: SHOPIFY_CLIENT_SECRET
        fromService:
          type: web
          name: mlp-sync
          envVarKey: SHOPIFY_CLIENT_SECRET
      - key: BSALE_OFFICE_ID
        fromService:
          type: web
          name: mlp-sync
          envVarKey: BSALE_OFFICE_ID
      - key: BSALE_PRICE_LIST_ID
        fromService:
          type: web
          name: mlp-sync
          envVarKey: BSALE_PRICE_LIST_ID
      # El cron no sirve el panel, pero `loadEnv` exige estas dos en producción.
      - key: PANEL_USER
        fromService:
          type: web
          name: mlp-sync
          envVarKey: PANEL_USER
      - key: PANEL_PASSWORD
        fromService:
          type: web
          name: mlp-sync
          envVarKey: PANEL_PASSWORD
      # Los precios NO se tocan salvo que se ponga a 1, a conciencia.
      - key: SYNC_AUTO_PRECIOS
        value: '0'
